# ===== Server =====
server.port=${PORT:8080}

# ===== Database (H2 for local, PostgreSQL for production) =====
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:stylehubdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}

# H2 Console (local dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

# ===== JWT =====
app.jwt.secret=${APP_JWT_SECRET:StyleHubSecretKey2025SuperLongRandomStringForHMACSHA256SecurityKey}
app.jwt.expiration-ms=86400000

# ===== Razorpay =====
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:placeholder_secret}
razorpay.currency=INR

# ===== CORS =====
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}

# ===== Admin =====
app.admin.email=${APP_ADMIN_EMAIL:admin@stylehub.com}
app.admin.password=${APP_ADMIN_PASSWORD:Admin@123}
